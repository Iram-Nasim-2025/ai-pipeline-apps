<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 375px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header input {
            width: 70%;
            height: 30px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .header button {
            width: 25%;
            height: 30px;
            padding: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .header button:hover {
            background-color: #3e8e41;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .todo-item:last-child {
            border-bottom: none;
        }
        .todo-item span {
            font-size: 16px;
        }
        .todo-item span.completed {
            text-decoration: line-through;
            color: #666;
        }
        .todo-item button {
            width: 20px;
            height: 20px;
            padding: 0;
            font-size: 16px;
            background-color: #fff;
            border: none;
            cursor: pointer;
        }
        .todo-item button:hover {
            background-color: #f0f0f0;
        }
        .footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 20px;
        }
        .footer span {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <input type="text" id="todo-input" placeholder="Add new todo">
            <button id="add-todo-btn">Add</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <div class="footer">
            <span id="remaining-todos">0 items left</span>
        </div>
    </div>
    <script>
        let todos = [];
        let todoInput = document.getElementById('todo-input');
        let addTodoBtn = document.getElementById('add-todo-btn');
        let todoList = document.getElementById('todo-list');
        let remainingTodosSpan = document.getElementById('remaining-todos');

        addTodoBtn.addEventListener('click', addTodo);

        function addTodo() {
            let todoText = todoInput.value.trim();
            if (todoText !== '') {
                let todo = {
                    text: todoText,
                    completed: false
                };
                todos.push(todo);
                todoInput.value = '';
                renderTodos();
            }
        }

        function renderTodos() {
            todoList.innerHTML = '';
            let remainingTodos = 0;
            todos.forEach((todo, index) => {
                let todoItem = document.createElement('li');
                todoItem.classList.add('todo-item');
                let todoSpan = document.createElement('span');
                todoSpan.textContent = todo.text;
                if (todo.completed) {
                    todoSpan.classList.add('completed');
                }
                let deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'X';
                deleteBtn.addEventListener('click', () => {
                    todos.splice(index, 1);
                    renderTodos();
                });
                let completeBtn = document.createElement('button');
                completeBtn.textContent = todo.completed ? 'Uncomplete' : 'Complete';
                completeBtn.addEventListener('click', () => {
                    todo.completed = !todo.completed;
                    renderTodos();
                });
                todoItem.appendChild(todoSpan);
                todoItem.appendChild(completeBtn);
                todoItem.appendChild(deleteBtn);
                todoList.appendChild(todoItem);
                if (!todo.completed) {
                    remainingTodos++;
                }
            });
            remainingTodosSpan.textContent = `${remainingTodos} items left`;
        }
    </script>
</body>
</html>
